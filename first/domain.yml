version: "3.1"

intents:
  - dieta
  - pedir_receta
  - pedir_meal_prep
  - preguntar_ingredientes
  - preguntar_valornutricional
  - listacompras
  - cantidad_platos
  - platos
  - saludar
  - despedir
  - afirmar
  - negar
  - bot_challenge
  - nlu_fallback

entities:
  - ingrediente
  - platos
  - sabor
  - num_platos
  - dieta
  - nutriente

actions:
  - action_recomendar_plato
  - action_recomendar_receta
  - action_info_nutricional
  - action_meal_prep_semanal
  - action_lista_compras
  - utter_fallback

slots:
  ingrediente:
    type: list
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: ingrediente

  platos:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: platos

  sabor:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: sabor

  num_platos:
    type: float
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: num_platos

  dieta:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: dieta

  nutriente:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: nutriente

responses:
  utter_bocadillo:
    - text: "Puedes preparar un bocadillo."

  utter_ensalada_capresa:
    - text: "Puedes preparar una ensalada capresa."

  utter_tostada:
    - text: "Puedes preparar una tostada."

  utter_montadito:
    - text: "Puedes preparar un montadito."

  utter_sin_ingredientes:
    - text: "No tienes suficientes ingredientes, te recomiendo ir a un restaurante."

  utter_valor_nutricional:
    - text: "{platos}... qué rico. Ese plato está lleno de nutrientes."

  utter_ingredientes:
    - text: "Aquí tienes la lista de ingredientes recomendados."

  utter_listacompras:
    - text: "Claro, aquí te digo los ingredientes que debes comprar."

  utter_cantidad_platos:
    - text: "Claro, aquí tienes una lista de {num_platos} platos."

  utter_saludo:
    - text: "¡Hola! ¿En qué puedo ayudarte hoy?"

  utter_despedir:
    - text: "¡Hasta luego! Si necesitas algo más, no dudes en preguntar."

  utter_iamabot:
    - text: "Soy un chef de la Ugr."

  utter_fallback:
    - text: "Lo siento... con eso no te puedo ayudar, pero ¿qué tal si planificamos tu menú semanal para compensar? ¿Te gustaría? :)"

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
