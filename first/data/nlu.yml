version: "3.1"

nlu:
  - lookup: ingrediente
    examples: |
      - tomate
      - arroz
      - pollo
      - cebolla
      - ajo
      - zanahoria
      - papa
      - pimiento
      - sal
      - aceite de oliva
      - carne molida
      - huevo
      - lentejas
      - espinaca
      - leche
      - pan
      - queso
      - champiñones
      - nata
      - garbanzos
      - berenjena
      - hummus
      - rúcula
      - tofu

  - lookup: dieta
    examples: |
      - keto
      - baja en carbohidratos
      - baja en grasas
      - alta en proteínas
      - vegana
      - vegetariana
      - paleo
      - sin gluten
      - mediterránea
      - baja en azúcar

  - lookup: platos
    examples: |
      - pasta al pesto
      - paella
      - pollo empanado
      - pescado al horno
      - verduras a la plancha
      - ensalada césar
      - carne en salsa de zanahoria
      - pescado a la plancha
      - potaje de lentejas

  - lookup: sabor
    examples: |
      - dulce
      - salado
      - ácido
      - amargo
      - picante
      - umami
      - ahumado
      - fresco
      - suave
      - intenso

  - regex: numero_platos
    examples: |
      - (?i)\b(?:\d+|un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez)\b

  - intent: preguntar_ingredientes
    examples: |
      - ¿Qué ingredientes necesito para [pasta al pesto](platos)?
      - ¿Qué ingredientes lleva una [ensalada césar](platos)?
      - ¿Qué debo comprar para hacer [paella](platos)?
      - ¿Qué necesito si quiero preparar [potaje de lentejas](platos)?
      - ¿Qué ingredientes hacen falta para [pollo empanado](platos)?
      - Hazme una lista de compras para [ensalada césar](platos)
      - ¿Qué tengo que comprar para hacer [pasta al pesto](platos)?

  - intent: preguntar_valornutricional
    examples: |
      - ¿Qué valor nutricional tiene el [tomate](ingrediente)?
      - ¿Cuántas calorías tiene el [queso](ingrediente)?
      - ¿Cuántas proteínas tiene la [lenteja](ingrediente)?
      - ¿Cuántos carbohidratos tiene una [paella](platos)?
      - ¿Cuántas grasas tiene el [huevo](ingrediente)?
      - ¿Qué nutrientes tiene la [pasta al pesto](platos)?
      - ¿Cómo es el valor nutricional del [potaje de lentejas](platos)?
      - ¿Qué contiene nutricionalmente una [ensalada césar](platos)?

  - intent: listacompras
    examples: |
      - Dame una lista de compras para [pasta al pesto](platos)
      - ¿Qué ingredientes necesito para preparar [paella](platos)?
      - Hazme la lista de la compra para hacer [pollo empanado](platos)
      - ¿Qué tengo que comprar para cocinar [potaje de lentejas](platos)?
      - ¿Qué ingredientes hacen falta para preparar [ensalada césar](platos)?

  - intent: cantidad_platos
    examples: |
      - Quiero [3](numero_platos) platos
      - Necesito [cuatro](numero_platos) platos
      - Me gustaría preparar [un](numero_platos) plato

  - intent: platos
    examples: |
      - Tengo algunos ingredientes pero no sé qué hacer con ellos
      - Dime una receta
      - Recomiéndame un plato que pueda cocinar
      - ¿Qué puedo cocinar con estos ingredientes?
      - Tengo [pan](ingrediente), [queso](ingrediente) y [tomate](ingrediente), ¿qué puedo hacer?
      - ¿Qué recetas puedo hacer con [garbanzos](ingrediente)?
      - ¿Qué puedo preparar con [champiñones](ingrediente) y [nata](ingrediente)?

  - intent: pedir_receta
    examples: |
      - Recomiéndame una receta [vegana](dieta)
      - ¿Qué puedo cocinar si soy [vegetariano](dieta)?
      - Dame una receta [sin gluten](dieta)

  - intent: pedir_meal_prep
    examples: |
      - Quiero un meal prep semanal para dieta [cetogénica](dieta)
      - ¿Qué puedo comer esta semana si soy [vegana](dieta)?
      - Plan semanal con [garbanzos](ingrediente) y dieta [mediterránea](dieta)

  - intent: saludar
    examples: |
      - hola
      - buenos días
      - buenas tardes
      - qué onda
      - qué pasa amigo

  - intent: despedir
    examples: |
      - nos vemos
      - adiós
      - hasta luego
      - chau
      - que tengas un buen día

  - intent: afirmar
    examples: |
      - sí
      - claro
      - por supuesto
      - correcto

  - intent: negar
    examples: |
      - no
      - para nada
      - no lo creo
      - no me gusta eso

  - intent: bot_challenge
    examples: |
      - ¿Eres un robot?
      - ¿Eres un asistente virtual?
      - ¿Eres un chatbot?
      - ¿estoy hablando con un bot?
