version: "3.1"

rules:
  - rule: "Saludo"
    steps:
      - intent: saludar
      - action: utter_saludo

  - rule: "Despedida"
    steps:
      - intent: despedir
      - action: utter_despedir

  - rule: "Preguntar por ingredientes"
    steps:
      - intent: preguntar_ingredientes
      - action: action_lista_compras

  - rule: "Preguntar por valor nutricional"
    steps:
      - intent: preguntar_valornutricional
      - action: action_info_nutricional

  - rule: "Lista de compras"
    steps:
      - intent: listacompras
      - action: action_lista_compras

  - rule: "Cantidad de platos"
    steps:
      - intent: cantidad_platos
      - action: utter_cantidad_platos

  - rule: "Soy chef"
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: "Recomendar plato con ingredientes"
    steps:
      - intent: platos
      - action: action_recomendar_plato

  - rule: "Recomendar receta por dieta"
    steps:
      - intent: pedir_receta
      - action: action_recomendar_receta

  - rule: "Meal prep semanal"
    steps:
      - intent: pedir_meal_prep
      - action: action_meal_prep_semanal

  - rule: Respuesta por defecto si no se entiende
    steps:
      - intent: nlu_fallback
      - action: utter_fallback
